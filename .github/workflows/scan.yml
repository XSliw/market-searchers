name: scan

on:
  schedule:
    - cron: '*/20 * * * *'   # каждые 20 минут (публичный репо — минуты не лимитируются)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Только показать: не слать в Telegram и не коммитить'
        type: boolean
        default: true
      source:
        description: 'Ограничить источником'
        type: choice
        options: [all, kufar, sendico]
        default: all

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q core sources scan.py webhook.py

      - name: Scan
        env:
          KUFAR_BOT_TOKEN: ${{ secrets.KUFAR_BOT_TOKEN }}
          KUFAR_CHAT_ID: ${{ secrets.KUFAR_CHAT_ID }}
          SENDICO_BOT_TOKEN: ${{ secrets.SENDICO_BOT_TOKEN }}
          SENDICO_CHAT_ID: ${{ secrets.SENDICO_CHAT_ID }}
          SENDICO_EMAIL: ${{ secrets.SENDICO_EMAIL }}
          SENDICO_PASSWORD: ${{ secrets.SENDICO_PASSWORD }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
            [ "${{ inputs.source }}" != "all" ] && ARGS="$ARGS --source ${{ inputs.source }}"
          fi
          echo "scan args: $ARGS"
          python scan.py $ARGS

      - name: Commit state
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "state.json без изменений"
          else
            git commit -m "state: авто-обновление $(date -u +%FT%TZ)"
            git pull --rebase --autostash origin main || true
            git push
          fi
